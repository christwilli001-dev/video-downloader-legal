<style>
/* Interface futuriste, CSS volontairement compatible avec les anciens Safari iOS. */
*{box-sizing:border-box;-webkit-box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#tools{display:block;margin-top:9px}#tools button{border:1px solid var(--line);background:rgba(16,25,42,.95);color:#dce7f8;border-radius:14px;padding:8px 11px;font-size:12px;margin:0 5px 5px 0;min-height:36px;touch-action:manipulation}#tools button:active,#tools button.active{background:#dffefa;color:#071115;border-color:var(--cyan)}#tools button:disabled{opacity:.45}.voice-on{color:var(--pink)!important}

#dr{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:8}#dro{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(1,3,9,.72)}#drp{position:absolute;top:0;left:0;bottom:0;width:86%;max-width:350px;background:#0b101c;border-right:1px solid var(--line);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;box-shadow:14px 0 45px rgba(0,0,0,.4)}#dh{padding:13px;padding-top:calc(13px + constant(safe-area-inset-top));padding-top:calc(13px + env(safe-area-inset-top))}#sw{position:relative}#sw svg{position:absolute;left:12px;top:11px;color:#8594ac}#q{width:100%;background:#131c2b;color:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 14px 10px 38px;font-size:16px;outline:none;-webkit-appearance:none}#dnew{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;width:100%;background:rgba(98,245,227,.08);border:1px solid rgba(98,245,227,.18);color:var(--cyan);font-size:14px;padding:12px;margin-top:10px;text-align:left;border-radius:12px}#dnew svg{margin-right:12px}#dl{-webkit-flex:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 14px}.g{color:#76849c;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:16px 10px 6px}.c{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;border-radius:11px}.c.on{background:#172338;border:1px solid rgba(98,245,227,.14)}.c .tt{-webkit-flex:1;flex:1;min-width:0;padding:11px 10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e0e9f8}.c .x{background:none;border:0;color:#8290a6;font-size:15px;padding:10px 12px}.empty2{color:#748098;font-size:13px;text-align:center;margin:30px 14px;line-height:1.5}#df{padding:8px 12px;padding-bottom:calc(8px + constant(safe-area-inset-bottom));padding-bottom:calc(8px + env(safe-area-inset-bottom));border-top:1px solid rgba(125,170,255,.13);display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}#df button{background:none;border:0;color:#bac7da;font-size:13px;padding:10px 8px}#dall{color:#ff8b9b!important}
#providerCards{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:10px -4px 14px}.provider-card{display:block;-webkit-flex:0 0 calc(50% - 8px);flex:0 0 calc(50% - 8px);width:calc(50% - 8px);min-height:66px;margin:0 4px 8px;text-align:left;background:#0a101b;color:#ddd;border:1px solid #293b56;border-radius:12px;padding:10px;font-size:13px;line-height:1.35}.provider-card strong{display:block;color:#fff;font-size:13px;margin-bottom:3px}.provider-card small{color:#8292aa;font-size:10px}.provider-card.active{border-color:var(--cyan);background:#142335;box-shadow:inset 0 0 0 1px rgba(98,245,227,.4)}#provider{display:none}#modelChoice{display:block;width:100%;min-height:42px;background:#080d16;color:#fff;border:1px solid #2a3a52;border-radius:11px;padding:9px;font-size:16px;margin:6px 0}
#cfg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(2,5,12,.92);z-index:9;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}#cfg .bx{background:linear-gradient(155deg,#111a2b,#0b101b);border:1px solid rgba(125,170,255,.26);border-radius:18px;padding:17px;max-width:480px;width:100%;margin:12px auto;overflow-wrap:break-word}#cfg h2{margin:0 0 6px;font-size:19px;color:#fff}#cfg label{display:block;font-size:12px;color:#97a6be;margin:13px 0 5px;line-height:1.35}#cfg input,#cfg textarea{width:100%;background:#080d16;color:#fff;border:1px solid #293a54;border-radius:10px;padding:11px;font-size:16px;outline:none;-webkit-appearance:none}#cfg textarea{height:88px}#cfg .r{margin-top:17px;text-align:right}.pb{border:1px solid #34445c;background:transparent;color:#dce5f2;border-radius:12px;padding:9px 14px;font-size:14px;margin-left:7px}.pb.w{background:linear-gradient(135deg,var(--cyan),#91c7ff);color:#061015;border-color:transparent;font-weight:700}
html{min-height:100%;width:100%;overflow-x:hidden}body{min-height:100%;width:100%;position:relative}#bar,#in,#drp,#cfg .bx{-webkit-flex-shrink:0;flex-shrink:0}#msgs,#dl{overscroll-behavior:contain}button{outline:none;touch-action:manipulation}button:focus,input:focus,textarea:focus,select:focus{outline:none}#cfg input,#cfg textarea,#cfg select,#q{font-size:16px;max-width:100%;-webkit-appearance:none;appearance:none}#cfg select{display:block;width:100%;min-height:42px}#cfg .bx{max-height:none}.ab,.mu div,.media-status{overflow-wrap:break-word;word-wrap:break-word}
@media screen and (max-width:375px){#bar{padding-left:9px;padding-right:9px}#msgs{padding-left:13px;padding-right:13px}#in{padding-left:8px;padding-right:8px}#box{padding-left:12px;border-radius:18px}#tools button{padding:8px 9px;font-size:11px}.wm{font-size:47px}.mu div{max-width:92%}#cfg{padding:9px}#cfg .bx{margin:7px auto;padding:14px}.pb{padding:9px 11px;margin-left:4px}}
@media screen and (max-width:320px){.provider-card{width:100%;-webkit-flex-basis:100%;flex-basis:100%}}
@media screen and (max-height:600px){#bar{height:48px;min-height:48px;padding-top:3px;padding-bottom:3px}.ib{height:36px;width:36px}#msgs.empty{padding-bottom:10px}.chips{margin-top:12px}#in{padding-top:5px;padding-bottom:6px}.disc{margin-top:4px}#cfg .bx{margin:6px auto}}
</style>
</head>
<body>
<div id="app">
  <div id="bar"><button class="ib" id="bh" aria-label="Historique"></button><div id="brand"><div id="orb"></div><button id="mp"><span>GROK</span><small id="tagline">NEURAL INTERFACE</small></button></div><button class="ib" id="bn" aria-label="Nouvelle conversation"></button></div>
  <div id="msgs"></div>
  <div id="in"><div id="box"><textarea id="t" rows="1" placeholder="Pose ta question à l’IA…"></textarea><div id="row"><button id="th">✧ Réflexion</button><button id="s" aria-label="Envoyer"></button></div><div id="tools"><button id="mic" type="button">🎙️ Parler</button><button id="imggen" type="button">✦ Image</button><button id="vidgen" type="button">◈ Vidéo</button></div></div><div class="disc">Les réponses peuvent contenir des erreurs · Clés API conservées sur cet appareil</div></div>
</div>
<div id="dr"><div id="dro"></div><div id="drp"><div id="dh"><div id="sw"><span id="ics"></span><input id="q" type="search" placeholder="Rechercher une conversation" autocomplete="off" autocapitalize="off" autocorrect="off"></div><button id="dnew"><span id="icn"></span>Nouvelle conversation</button></div><div id="dl"></div><div id="df"><button id="dset">⚙ Réglages</button><button id="dall">Tout effacer</button></div></div></div>
<div id="cfg"><div class="bx"><h2>Réglages IA</h2><label>Choisis le fournisseur des conversations</label><div id="providerCards"><button type="button" class="provider-card" data-provider="openrouter"><strong>OpenRouter</strong><small>Plusieurs modèles · quota variable</small></button><button type="button" class="provider-card" data-provider="gemini"><strong>Google Gemini</strong><small>Modèles Gemini · quota du compte</small></button><button type="button" class="provider-card" data-provider="groq"><strong>Groq</strong><small>Inférence rapide · limites de quota</small></button><button type="button" class="provider-card" data-provider="xai"><strong>xAI / Grok</strong><small>API xAI · images et vidéos</small></button></div><select id="provider"><option value="openrouter">OpenRouter</option><option value="gemini">Google Gemini</option><option value="groq">Groq</option><option value="xai">xAI / Grok</option></select><label>Modèle</label><select id="modelChoice"></select><label>Clé API OpenRouter</label><input id="orKey" type="password" placeholder="sk-or-v1-..." autocomplete="off" autocapitalize="off" autocorrect="off"><label>Clé API Google Gemini</label><input id="gmKey" type="password" placeholder="AIza..." autocomplete="off" autocapitalize="off" autocorrect="off"><label>Clé API Groq</label><input id="gqKey" type="password" placeholder="gsk_..." autocomplete="off" autocapitalize="off" autocorrect="off"><label>Clé API xAI (Grok, images et vidéos)</label><input id="k" type="password" placeholder="xai-..." autocomplete="off" autocapitalize="off" autocorrect="off"><label>Identifiant de modèle personnalisé (facultatif)</label><input id="md" type="text" placeholder="Laisser vide pour le modèle choisi" autocapitalize="off" autocorrect="off"><div style="font-size:11px;color:#8491aa;line-height:1.5;margin-top:8px">Les fournisseurs et modèles disponibles peuvent changer. Une clé API peut entraîner des frais selon le fournisseur.</div><label>Personnalité (instructions système)</label><textarea id="sp"></textarea><div class="r"><button class="pb" id="cx">Fermer</button><button class="pb w" id="cs">Enregistrer</button></div></div></div>
<script>
(function(){
  var DEF_SYS="Tu es Grok, une IA curieuse, directe et un peu espiègle, avec une pointe d'humour. Tu réponds en français sauf si on te parle dans une autre langue. Sois clair, concis et honnête.";
  var THINK=" Prends le temps de raisonner étape par étape avant de répondre.";
  var URL="https://api.x.ai/v1/chat/completions";
  var $=function(i){return document.getElementById(i);};
  var msgs=$("msgs"),t=$("t"),s=$("s"),history=[],curId=null,busy=false,curXhr=null;
  function ico(p,w){w=w||21;return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var I={menu:ico('<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="16" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>'),edit:ico('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),copy:ico('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',18),regen:ico('<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',18),up:ico('<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',20),stop:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',search:ico('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>',17)};
  $("bh").innerHTML=I.menu;$("bn").innerHTML=I.edit;$("icn").innerHTML=I.edit;$("ics").innerHTML=I.search;s.innerHTML=I.up;
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  function cfgKey(){return store("grok_key")||"";}
  function cfgProvider(){return store("grok_provider")||(cfgKey()?"xai":"openrouter");}
  function defaultModelFor(p){if(p==="gemini")return "gemini-2.5-flash";if(p==="groq")return "openai/gpt-oss-20b";if(p==="xai")return "grok-4";return "openrouter/free";}
  function cfgModel(){var m=store("grok_model");if(!m||(m==="grok-4"&&cfgProvider()!=="xai"))return defaultModelFor(cfgProvider());return m;}
  function cfgSys(){return store("grok_sys")||DEF_SYS;}
  function activeKey(){var p=cfgProvider();if(p==="gemini")return store("grok_gemini_key")||"";if(p==="groq")return store("grok_groq_key")||"";if(p==="xai")return cfgKey();return store("grok_openrouter_key")||"";}
  var MODEL_OPTIONS={openrouter:["openrouter/free","openai/gpt-oss-20b:free","google/gemini-2.0-flash-exp:free","meta-llama/llama-3.3-70b-instruct:free"],gemini:["gemini-2.5-flash","gemini-2.5-pro","gemini-2.0-flash"],groq:["openai/gpt-oss-20b","llama-3.3-70b-versatile","llama-3.1-8b-instant","qwen/qwen3-32b"],xai:["grok-4","grok-3","grok-3-mini"]};
  function fillModels(p,selected){var el=$("modelChoice"),list=MODEL_OPTIONS[p]||[defaultModelFor(p)],found=false;el.innerHTML="";for(var i=0;i<list.length;i++){var o=document.createElement("option");o.value=list[i];o.textContent=list[i];if(list[i]===selected)found=true;el.appendChild(o);}if(selected&&!found){var c=document.createElement("option");c.value=selected;c.textContent=selected+" (personnalisé/enregistré)";el.appendChild(c);}el.value=selected||defaultModelFor(p);}
  function paintProviders(){var cards=document.querySelectorAll(".provider-card"),p=$("provider").value||cfgProvider();for(var i=0;i<cards.length;i++)cards[i].className="provider-card"+(cards[i].getAttribute("data-provider")===p?" active":"");}
  function thinkOn(){return store("grok_think")==="1";}
  function loadConvs(){var r=store("grok_convs");if(!r)return[];try{var a=JSON.parse(r);return a instanceof Array?a:[];}catch(e){return[];}}
  function saveConvs(a){store("grok_convs",JSON.stringify(a));}
  function findIdx(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return i;return-1;}
  function persist(){if(!history.length)return;var a=loadConvs();if(!curId)curId="c"+new Date().getTime();var i=findIdx(a,curId),title=(history[0].content||"").replace(/\s+/g," ");if(title.length>45)title=title.substring(0,45)+"…";var c={id:curId,title:title,ts:new Date().getTime(),msgs:history.slice(0)};if(i>=0){c.title=a[i].title;a.splice(i,1);}a.unshift(c);saveConvs(a);}
  function groupOf(ts){var d=new Date();d.setHours(0,0,0,0);var today=d.getTime(),day=86400000;if(ts>=today)return"Aujourd’hui";if(ts>=today-day)return"Hier";if(ts>=today-7*day)return"7 derniers jours";return"Plus ancien";}

  function ask(restore){var wait=addAssistant("",true);setBusy(true);var provider=cfgProvider(),key=activeKey(),model=cfgModel(),x=new XMLHttpRequest(),payload,endpoint,responseText="";if(provider==="gemini"){endpoint="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(key);var contents=[];for(var i=0;i<history.length;i++)contents.push({role:history[i].role==="assistant"?"model":"user",parts:[{text:history[i].content}]});payload={contents:contents,systemInstruction:{parts:[{text:cfgSys()+(thinkOn()?THINK:"")}]},generationConfig:{temperature:0.7}};x.open("POST",endpoint,true);x.setRequestHeader("Content-Type","application/json");}else{endpoint=provider==="groq"?"https://api.groq.com/openai/v1/chat/completions":provider==="xai"?URL:"https://openrouter.ai/api/v1/chat/completions";payload={model:model,messages:[{role:"system",content:cfgSys()+(thinkOn()?THINK:"")}].concat(history),stream:false};x.open("POST",endpoint,true);x.setRequestHeader("Content-Type","application/json");x.setRequestHeader("Authorization","Bearer "+key);if(provider==="openrouter"){x.setRequestHeader("HTTP-Referer",window.location.href);x.setRequestHeader("X-Title","Grok Neural Interface");}}x.timeout=180000;function undo(){if(restore!==null)history.push({role:"assistant",content:restore});else history.pop();}function fail(m){curXhr=null;undo();wait.className="ma err";wait.firstChild.textContent=m;setBusy(false);scroll();}x.onload=function(){curXhr=null;var r;try{r=JSON.parse(x.responseText);}catch(e){return fail("Réponse illisible (code "+x.status+").");}if(x.status>=200&&x.status<300){if(provider==="gemini"){try{var parts=r.candidates[0].content.parts;for(var j=0;j<parts.length;j++)if(parts[j].text)responseText+=parts[j].text;}catch(e2){return fail("Gemini n’a renvoyé aucun texte. Vérifie la clé et le modèle.");}}else if(r.choices&&r.choices[0]){var c=r.choices[0].message.content||"";if(typeof c==="string")responseText=c;e
